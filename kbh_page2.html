<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الصورة في موقع الشيخ كريم برهان الجنابي</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
width: 100%;
        background-color: #dddbc3;
        color: white;
        font-family: 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden; /* يمنع التزحلق الجانبي في الموبايل */
        }
        header {
width: 100%;
        background: linear-gradient(135deg, #1104019b, #000000);
        color: white;
        position: sticky;
        padding: 1rem 0; /* تقليل البادينج العلوي */
        top: 0;
        z-index: 1000;
        }

        .top-bar {
display: flex;
        justify-content: center;
        align-items: center;
        padding: 0 10px;
        }
        header h1 {
margin: 0;
        font-size: 1.2rem;
        color: #fff700;
        text-align: center;
        }
.image-container {
        width: 100%;
        display: flex;
        justify-content: center;
        padding: 10px;
    }
        .image-container img {
    margin-top: 10px;
        max-width: 95%; /* تكبير الصورة قليلاً للموبايل */
        height: auto;
        max-height: 60vh; 
        border-radius: 15px;
        border: 4px solid rgb(0, 0, 0);
        box-shadow: 0px 0px 20px rgba(255, 0, 0, 0.5);
        }

        .info-box {
background: white;
        color: #000000;
        width: 90%;
        max-width: 600px;
        padding: 1.2rem;
        border-radius: 1.5rem;
        border-right: 8px solid #ff0000;
        box-sizing: border-box; /* لضمان حساب المقاسات بشكل صحيح */
        margin: 15px 0;
        }
        .info-box h3 {
 background: #2e0abf;
        color: #e5ff00;
        display: inline-block;
        padding: 5px 12px;
        border-radius: 8px;
        margin: 10px 0;
        font-size: 1rem;
        }
        .info-box p {
margin: 0.5rem 0;
        padding-right: 10px; /* تقليل المسافة هنا ضروري للموبايل */
        font-size: 1rem;
        text-align: justify;
        color: #000000;
        line-height: 1.6;
        }
        .back-btn {
  margin: 1.5rem 0;
        padding: 10px 25px;
        background-color: #f20b0b;
        color: white;
        text-decoration: none;
        border: 2px solid #ffffff;
        border-radius: 50px;
        font-weight: bold;
        font-size: 0.9rem;
        transition: 0.3s;
        }
        .back-btn:hover { 
            background-color: #ffffff; 
            color: #2e0abf; 
        }
        footer { 
 width: 100%;
        padding: 15px 5px;
        margin-top: auto; 
        font-size: 0.8rem; 
        color: #2e0abf;
        background-color: #ffffff;
        text-align: center;
        }
    /* تعديلات خاصة للموبايل فقط */
    @media (max-width: 600px) {
        header h1 { font-size: 1rem; }
        .info-box { width: 95%; }
        .info-box p { padding-right: 5px; } /* إلغاء الـ 5rem اللي كانت مخربة التصميم */
        .back-btn { width: 80%; text-align: center; }
    }
        </style>
</head>
<body>
<header>

  <div class="top-bar">
    <h2  id="item-title-display" style="color: rgb(255, 255, 0); text-align: center; "></h2>
  </div>

</header>

    <div class="image-container">
        <img id="main-img" src="" alt="حدث خطا في تحميل الصورة 😢">   
    
    </div>


    <a href="index.html" class="back-btn">👉 العودة للموقع الرسمي</a>

    <div class="info-box">
        <h3>السنــــــــــة:</h3> <p id="item-year"></p>
        <h3>الدولـــــــــة:</h3> <p id="item-country"></p>
        <h3>الــــــوصف:</h3> <p id="item-desc"></p>
    </div>

    <a href="index.html" class="back-btn">👉 العودة للموقع الرسمي</a>

    <footer>
  <p>© 2026  جميع الحقوق محفوظة - الشيخ كريم برهان حسين الجنابي -  تصميم وبرمجة / مرتضى بشير كريم الجنابي</p>
    </footer>
    <div class="search-wrapper">
    <div id="searchBox" class="search-box">
        <input type="text" id="searchInput" style="color: #943a0d;" placeholder="اكتب للبحث..." onkeypress="handleSearch(event)">
        <button onclick="executeSearch()" style="background: #943a0d; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;">بحث</button>
    </div>
    <div class="search-floating-btn" onclick="toggleSearch()">
        <i class="fa fa-search"></i>
    </div>
</div>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="js.js"></script>
</body>

</html>
